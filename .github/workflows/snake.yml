name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/snake.yml

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: Libes6
          outputs: |
            assets/github-snake.svg
            assets/github-snake-dark.svg

      - uses: EndBug/add-and-commit@v9
        with:
          message: "chore: update contribution snake [skip ci]"
          add: "assets/*.svg"
          default_author: github_actions[bot]
